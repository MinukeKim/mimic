<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mimic you v0.60</title>
    <!-- [포팅 주의] 실제 서비스 배포 시에는 CDN 대신 빌드된 CSS 파일(예: style.css)을 사용하여 FOUC(화면 깜빡임) 현상을 방지하고 로딩 속도를 높이세요. -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background-color: #ffffff;
            color: #334155;
            transition: background-color 0.5s ease;
        }

        /* 2:3 전신 비율 캔버스 반응형 제어 */
        .canvas-responsive {
            width: 100%;
            max-width: 320px;
            height: auto;
            aspect-ratio: 2 / 3;
        }

        @media (max-width: 768px) {
            .canvas-responsive {
                max-width: 180px;
            }
            body {
                padding: 1rem !important;
            }
            #tutor-bubble-container {
                padding: 1.5rem !important;
                min-height: 120px !important;
                border-radius: 1.5rem !important;
            }
            #tutor-bubble {
                font-size: 1.25rem !important;
                line-height: 1.5 !important;
            }
            #user-bubble-container {
                padding: 1.25rem !important;
                min-height: 100px !important;
                border-radius: 1.5rem !important;
            }
            #user-text {
                font-size: 1rem !important;
                line-height: 1.4 !important;
            }
            #main-action-btn {
                padding: 1rem 2.5rem !important;
                font-size: 1.25rem !important;
                border-radius: 1rem !important;
            }
            .max-w-7xl {
                gap: 1rem !important;
            }
            .grid {
                gap: 1rem !important;
            }
            .flex-wrap {
                gap: 0.5rem !important;
                padding: 0.5rem !important;
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-8 md:p-16 select-none bg-white">

    <!-- 1회성 시작 오버레이 -->
    <div id="start-overlay" class="fixed inset-0 bg-[#0f172a] z-[60] flex flex-col items-center justify-center text-white cursor-pointer transition-opacity duration-300" onclick="initAppOnInteraction()">
        <h2 class="text-5xl font-extrabold tracking-tight mb-4 text-[#f8fafc]">Mimic you</h2>
        <p class="text-slate-400 text-sm font-bold tracking-widest uppercase">Click anywhere to start</p>
    </div>

    <!-- 메인 네이티브 컨테이너 -->
    <div class="w-full max-w-7xl mx-auto flex flex-col flex-1 justify-between gap-12">
        
        <!-- HEADER BAR -->
        <div class="flex flex-col md:flex-row items-center justify-between border-b border-slate-100 pb-6 gap-4">
            <div>
                <h1 class="text-3xl font-extrabold text-slate-700 flex items-baseline tracking-tight">
                    Mimic you <span class="text-slate-400 text-base ml-3 font-bold">v0.60</span>
                </h1>
            </div>
        </div>

        <!-- MAIN LAYOUT -->
        <div class="grid grid-cols-1 md:grid-cols-12 gap-12 flex-1 items-stretch">
            
            <!-- 좌측 영역: 캔버스 + 캐릭터 선택 -->
            <div class="md:col-span-5 flex flex-col items-center justify-center space-y-6">
                <!-- 캔버스 -->
                <div class="relative flex items-center justify-center w-full">
                    <canvas id="tutorCanvas" width="400" height="600" class="bg-transparent canvas-responsive transition-all duration-300"></canvas>
                </div>
                
                <!-- 캐릭터 선택 버튼 (좌측 하단) -->
                <div class="flex space-x-1 bg-slate-100/80 p-1.5 rounded-xl border border-slate-200 shadow-sm mt-4">
                    <button id="char-xeno" onclick="setCharacter('xeno')" class="px-4 py-2 text-xs font-bold text-slate-500 rounded-lg transition-all">Xeno</button>
                    <button id="char-xena" onclick="setCharacter('xena')" class="px-4 py-2 text-xs font-bold text-slate-500 rounded-lg transition-all">Xena</button>
                </div>
            </div>

            <!-- 우측 영역: 튜터 말풍선 -> START -> YOU -> 게이지 -->
            <div class="md:col-span-7 flex flex-col justify-between h-full min-h-[500px] gap-6">
                
                <!-- 1. TUTOR 버블 -->
                <div id="tutor-bubble-container" class="p-10 md:p-12 rounded-[2.5rem] transition-all duration-500 flex flex-col justify-center min-h-[220px] shadow-sm relative border-0">
                    <div class="mb-3">
                        <span id="tutor-label" class="text-xs font-black text-slate-400 tracking-widest uppercase">TUTOR</span>
                    </div>
                    <div id="tutor-bubble" class="text-slate-800 font-extrabold text-2xl md:text-3xl leading-relaxed transition-all duration-300">
                        Initializing character...
                    </div>
                </div>

                <!-- 2. START 버튼 -->
                <div class="flex items-center justify-center p-5 bg-slate-50 rounded-2xl border border-slate-100 shadow-sm gap-4">
                    <button id="main-action-btn" onclick="toggleMimicMode()" class="px-12 py-5 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white text-xl font-black rounded-2xl shadow-md shadow-indigo-100 transition-all flex items-center justify-center gap-3">
                        <span id="btn-icon">▶</span>
                        <span id="btn-text">START</span>
                    </button>
                </div>

                <!-- 3. YOU 버블 -->
                <div id="user-bubble-container" class="p-10 md:p-12 rounded-[2.5rem] bg-[#fffdf0] border-0 flex flex-col justify-center min-h-[160px] shadow-sm relative transition-all duration-500">
                    <div class="mb-3 flex justify-between items-center">
                        <div class="flex items-center space-x-4">
                            <span class="text-xs font-black text-slate-400 tracking-widest uppercase">YOU</span>
                            <span id="automatic-speak-indicator" class="hidden flex items-center bg-rose-50 text-rose-600 text-[10px] font-black px-2.5 py-1.5 rounded-full border border-rose-100 animate-pulse">
                                <span class="w-2 h-2 bg-rose-500 rounded-full mr-1.5 animate-blink-record inline-block"></span>
                                Speak Now!
                            </span>
                        </div>
                        
                        <div id="mic-gauge-container" class="hidden flex items-center space-x-2 bg-indigo-50 px-3 py-1.5 rounded-full border border-indigo-100 transition-all duration-300">
                            <span class="text-[9px] font-black text-indigo-500 uppercase tracking-wider">Volume</span>
                            <div class="w-24 h-2 bg-indigo-200/60 rounded-full overflow-hidden">
                                <div id="mic-gauge-fill" class="h-full bg-indigo-500 w-0 transition-all duration-75"></div>
                            </div>
                        </div>
                    </div>
                    <div id="user-text" class="text-slate-400 font-bold text-lg md:text-xl italic transition-all duration-300 leading-relaxed">
                        Tutor is ready. Press START and say something!
                    </div>
                </div>

                <!-- 4. 피치 및 볼륨 게이지 (우측 하단) -->
                <div class="flex flex-wrap items-center justify-end gap-6 bg-slate-50/50 p-2.5 rounded-2xl border border-slate-100 shadow-sm mt-auto">
                    <!-- 변조 게이지 -->
                    <div class="flex items-center space-x-2 px-3 py-1">
                        <span class="text-xs font-bold text-slate-500">🐹 Pitch:</span>
                        <input type="range" id="mimic-pitch-slider" min="1.0" max="2.0" step="0.1" value="1.3" class="w-24 accent-indigo-600" oninput="updatePitchModifier(this.value)">
                        <span id="mimic-pitch-text" class="text-xs text-slate-500 font-mono font-bold w-10 text-right">1.3x</span>
                    </div>

                    <!-- 볼륨 게이지 -->
                    <div class="flex items-center space-x-2 px-3 py-1 border-l border-slate-200">
                        <span class="text-sm opacity-70">🔈</span>
                        <input type="range" id="master-vol" min="0" max="1" step="0.1" value="1" class="w-24 accent-slate-700" oninput="updateVolume(this.value)">
                        <span id="volume-text" class="text-xs text-slate-500 font-mono font-bold w-10 text-right">100%</span>
                    </div>
                </div>

            </div>

        </div>
    </div>

    <script>
        let currentChar = 'xeno';
        let isTutorSpeaking = false;
        let hasInitialized = false;
        let masterVolume = 1.0;
        let mimicPitchValue = 1.3;
        
        let isMimicActive = false;
        let isRecording = false;
        let isPlaybackActive = false;
        let audioCtx = null;
        let micStream = null;
        let micSourceNode = null;
        let analyserNode = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let playbackAnalyser = null;
        
        let silenceStartTime = null;
        let recordStartTime = 0;
        let vadAnimationId = null;
        
        const VOICE_THRESHOLD = 12;
        const SILENCE_DURATION = 1200;
        const MAX_RECORD_TIME = 6000;

        window.activeUtterance = null;
        window.ttsFallbackTimeout = null;

        const tutorBubble = document.getElementById('tutor-bubble');
        const tutorLabel = document.getElementById('tutor-label');
        const canvasEl = document.getElementById('tutorCanvas');
        const bubbleContainer = document.getElementById('tutor-bubble-container');
        const volSlider = document.getElementById('master-vol');
        const userText = document.getElementById('user-text');
        const mainBtn = document.getElementById('main-action-btn');
        const btnIcon = document.getElementById('btn-icon');
        const btnText = document.getElementById('btn-text');
        const micIndicator = document.getElementById('automatic-speak-indicator');
        const micGaugeContainer = document.getElementById('mic-gauge-container');
        const micGaugeFill = document.getElementById('mic-gauge-fill');

        const renderer = {
            config: {
                "xena": { "baseScale": 0.9, "baseX": -1, "baseY": 35, "eyeY": 96, "eyeSpacing": 70, "eyeWidth": 13, "eyeHeight": 13, "eyeLineThickness": 1, "pupilSize": 24, "pupilLeftOffsetX": 2.5, "pupilRightOffsetX": -3, "eyebrowY": -36, "eyebrowLength": 21, "eyebrowAngle": -14, "eyebrowThickness": 3, "mouthY": 145, "mouthWidth": 33.5, "verticalLineLength": 7, "mouthCurve": 9, "mouthOffsetX": 1, "mouthOffsetY": 1.5, "mouthLineThickness": 1.4, "mouthOpenStyle": "smiling" },
                "xeno": { "baseScale": 0.9, "baseX": 0, "baseY": 12, "eyeY": 67, "eyeSpacing": 66, "eyeWidth": 15, "eyeHeight": 15.5, "eyeLineThickness": 1, "pupilSize": 24.2, "pupilLeftOffsetX": 2.5, "pupilLeftOffsetY": 1, "pupilRightOffsetX": -3, "pupilRightOffsetY": 0.5, "eyebrowY": -33, "eyebrowLength": 26, "eyebrowAngle": -16, "eyebrowThickness": 4, "mouthY": 111, "mouthWidth": 29, "verticalLineLength": 7, "mouthCurve": 10, "mouthOffsetX": -1.5, "mouthOffsetY": 1, "mouthLineThickness": 1.6, "mouthOpenStyle": "smiling" }
            },
            simulation: { mouthOpen: 0, blinkState: 0, blinkTimer: 0, isSpeaking: false, speakType: 'none', vowel: 'A', speakIntervalId: null },
            ctx: null,
            images: { xena: new Image(), xeno: new Image() },
            imageLoaded: { xena: false, xeno: false },

            init: function() {
                this.ctx = canvasEl.getContext('2d');
                
                // [포팅 주의] 리눅스 기반 실제 서버(Vercel, AWS 등) 배포 시 대소문자를 엄격히 구분합니다. 
                // 실제 파일명과 정확히 동일해야 404 에러(이미지 엑스박스)가 발생하지 않습니다.
                this.images.xena.src = "Xena_base.png";
                this.images.xeno.src = "Xeno_base.png";
                
                this.images.xena.onload = () => { this.imageLoaded.xena = true; };
                this.images.xeno.onload = () => { this.imageLoaded.xeno = true; };
                
                this.startLoop();
            },

            startSpeakingAnim: function(type = 'tts') {
                clearInterval(this.simulation.speakIntervalId);
                this.simulation.isSpeaking = true;
                this.simulation.speakType = type;
                
                if (type === 'tts') {
                    const vowels = ['A', 'E', 'I', 'O', 'U'];
                    let vIdx = 0;
                    this.simulation.speakIntervalId = setInterval(() => {
                        this.simulation.mouthOpen = 4 + Math.random() * 8;
                        this.simulation.vowel = vowels[vIdx];
                        vIdx = (vIdx + 1) % vowels.length;
                    }, 130);
                }
            },

            stopSpeakingAnim: function() {
                this.simulation.isSpeaking = false;
                this.simulation.speakType = 'none';
                clearInterval(this.simulation.speakIntervalId);
                this.simulation.speakIntervalId = null;
                this.simulation.mouthOpen = 0;
            },

            startLoop: function() {
                const drawFrame = () => {
                    this.ctx.clearRect(0, 0, 400, 600);
                    const breathe = Math.sin(Date.now() / 420) * 3.5;
                    this.ctx.save();
                    this.ctx.translate(200, 300 + breathe);

                    if (this.imageLoaded[currentChar]) {
                        const img = this.images[currentChar];
                        const cfg = this.config[currentChar];
                        const drawWidth = img.width * cfg.baseScale;
                        const drawHeight = img.height * cfg.baseScale;
                        this.ctx.drawImage(img, -drawWidth/2 + cfg.baseX, -drawHeight/2 + cfg.baseY, drawWidth, drawHeight);
                    } else {
                        this.drawBackupSilhouette();
                    }

                    if (isPlaybackActive && playbackAnalyser) {
                        const bufferLength = playbackAnalyser.frequencyBinCount;
                        const dataArray = new Uint8Array(bufferLength);
                        playbackAnalyser.getByteFrequencyData(dataArray);
                        let sum = 0;
                        for (let i = 0; i < bufferLength; i++) {
                            sum += dataArray[i];
                        }
                        const average = sum / bufferLength;
                        
                        const targetMouthOpen = Math.min(14, average * 0.22);
                        this.simulation.mouthOpen = (this.simulation.mouthOpen * 0.75) + (targetMouthOpen * 0.25);
                        
                        const vowels = ['A', 'E', 'I', 'O', 'U'];
                        if (this.simulation.mouthOpen > 1.5) {
                            const vowelIndex = Math.floor((Date.now() / 120) % vowels.length);
                            this.simulation.vowel = vowels[vowelIndex];
                        }
                    }

                    this.drawVectorEyes();
                    this.drawVectorEyebrows();
                    this.drawVectorMouth();
                    
                    this.ctx.restore();

                    if (!this.simulation.isSpeaking) {
                        this.simulation.blinkTimer++;
                        if (this.simulation.blinkTimer > 200) {
                            this.simulation.blinkState = 1;
                            if (this.simulation.blinkTimer > 212) {
                                this.simulation.blinkState = 0;
                                this.simulation.blinkTimer = 0;
                            }
                        }
                    }

                    requestAnimationFrame(drawFrame);
                };
                drawFrame();
            },

            drawBackupSilhouette: function() {
                this.ctx.save();
                this.ctx.beginPath();
                const isXena = currentChar === 'xena';
                
                this.ctx.arc(0, 140, 100, 0, Math.PI * 2);
                this.ctx.fillStyle = isXena ? "#f0f7ff" : "#fffbf2"; 
                this.ctx.fill();

                this.ctx.beginPath();
                this.ctx.arc(0, 10, 105, 0, Math.PI * 2);
                this.ctx.fillStyle = isXena ? "#f8fafc" : "#fffbeb"; 
                this.ctx.fill();
                this.ctx.strokeStyle = "#cbd5e1";
                this.ctx.lineWidth = 4;
                this.ctx.stroke();

                this.ctx.fillStyle = "#64748b";
                this.ctx.font = "bold 13px sans-serif";
                this.ctx.textAlign = "center";
                this.ctx.fillText(`[${currentChar}_base.png] Loading...`, 0, 10);
                this.ctx.restore();
            },

            drawVectorEyes: function() {
                const cfg = this.config[currentChar];
                const halfSpacing = cfg.eyeSpacing / 2;
                const eyeYOff = cfg.eyeY - 200;

                const drawSingleEye = (ex, isLeft) => {
                    this.ctx.save();
                    if (this.simulation.blinkState === 1) {
                        this.ctx.beginPath();
                        this.ctx.arc(ex, eyeYOff + cfg.eyeHeight * 0.25, cfg.eyeWidth * 0.9, 0.1 * Math.PI, 0.9 * Math.PI, false);
                        this.ctx.strokeStyle = "#1e293b"; this.ctx.lineWidth = cfg.eyeLineThickness * 3.5; this.ctx.stroke();
                    } else {
                        this.ctx.beginPath();
                        this.ctx.ellipse(ex, eyeYOff, cfg.eyeWidth, cfg.eyeHeight, 0, 0, Math.PI * 2);
                        this.ctx.fillStyle = "#fff"; this.ctx.fill();
                        this.ctx.strokeStyle = "#1e293b"; this.ctx.lineWidth = cfg.eyeLineThickness || 1.5; this.ctx.stroke();

                        this.ctx.beginPath();
                        const pw = Math.min(cfg.eyeWidth * 0.85, cfg.pupilSize / 2);
                        const px = ex + (isLeft ? (cfg.pupilLeftOffsetX||0) : (cfg.pupilRightOffsetX||0));
                        const py = eyeYOff + (isLeft ? (cfg.pupilLeftOffsetY||0) : (cfg.pupilRightOffsetY||0));
                        this.ctx.ellipse(px, py, pw, pw, 0, 0, Math.PI * 2);
                        this.ctx.fillStyle = "#1e293b"; this.ctx.fill();

                        this.ctx.beginPath();
                        this.ctx.arc(px - pw*0.35, py - pw*0.35, pw*0.35, 0, Math.PI*2);
                        this.ctx.fillStyle = "#fff"; this.ctx.fill();
                    }
                    this.ctx.restore();
                };
                drawSingleEye(-halfSpacing, true); drawSingleEye(halfSpacing, false);
            },

            drawVectorEyebrows: function() {
                const cfg = this.config[currentChar];
                const halfSpacing = cfg.eyeSpacing / 2;
                const browY = (cfg.eyeY - 200) + cfg.eyebrowY;

                const drawBrow = (bx, isLeft) => {
                    this.ctx.save();
                    this.ctx.translate(bx, browY);
                    this.ctx.rotate((cfg.eyebrowAngle * Math.PI / 180) * (isLeft ? 1 : -1));
                    this.ctx.beginPath();
                    const half = cfg.eyebrowLength / 2;
                    this.ctx.moveTo(-half, isLeft ? -1.5 : 1.5);
                    this.ctx.quadraticCurveTo(0, -cfg.eyebrowThickness * 1.5, half, isLeft ? 1.5 : -1.5);
                    this.ctx.strokeStyle = "#1e293b";
                    this.ctx.lineWidth = cfg.eyebrowThickness; this.ctx.lineCap = "round"; this.ctx.stroke();
                    this.ctx.restore();
                };
                drawBrow(-halfSpacing, true); drawBrow(halfSpacing, false);
            },

            drawVectorMouth: function() {
                const cfg = this.config[currentChar];
                this.ctx.save();
                this.ctx.translate(cfg.mouthOffsetX || 0, (cfg.mouthY - 200) + (cfg.mouthOffsetY || 0));

                const currentMouthW = cfg.mouthWidth;
                const currentMouthH = this.simulation.mouthOpen;

                if (this.simulation.mouthOpen > 1.5) {
                    let scaleW = 1.0;
                    let scaleH = 1.0;
                    const activeVowel = this.simulation.vowel || 'A';
                    
                    if (activeVowel === 'A') { scaleW = 0.85; scaleH = 1.3; }
                    else if (activeVowel === 'E') { scaleW = 0.95; scaleH = 0.9; }
                    else if (activeVowel === 'I') { scaleW = 1.0; scaleH = 0.45; }
                    else if (activeVowel === 'O') { scaleW = 0.65; scaleH = 1.1; }
                    else if (activeVowel === 'U') { scaleW = 0.45; scaleH = 0.75; }

                    const mouthW = cfg.mouthWidth * scaleW;
                    const mouthH = this.simulation.mouthOpen * scaleH;

                    if (cfg.verticalLineLength > 0) {
                        const upperLipY = cfg.mouthOpenStyle === 'smiling' ? -mouthH * 0.15 : -mouthH;
                        if (-cfg.verticalLineLength < upperLipY) {
                            this.ctx.beginPath();
                            this.ctx.moveTo(0, -cfg.verticalLineLength);
                            this.ctx.lineTo(0, upperLipY);
                            this.ctx.strokeStyle = "#1e293b";
                            this.ctx.lineWidth = cfg.mouthLineThickness || 1.5;
                            this.ctx.lineCap = "round";
                            this.ctx.stroke();
                        }
                    }

                    this.ctx.beginPath();
                    if (cfg.mouthOpenStyle === 'smiling') {
                        this.ctx.moveTo(-mouthW, -mouthH * 0.15);
                        this.ctx.quadraticCurveTo(0, -mouthH * 0.55, mouthW, -mouthH * 0.15); 
                        this.ctx.quadraticCurveTo(0, mouthH * 1.55, -mouthW, -mouthH * 0.15); 
                        this.ctx.closePath();
                    } else {
                        this.ctx.ellipse(0, 0, mouthW, mouthH, 0, 0, Math.PI * 2);
                    }

                    const mouthGrad = this.ctx.createLinearGradient(0, -mouthH, 0, mouthH);
                    mouthGrad.addColorStop(0, "#3b0712"); 
                    mouthGrad.addColorStop(1, "#881337"); 
                    this.ctx.fillStyle = mouthGrad;
                    this.ctx.fill();
                    this.ctx.strokeStyle = "#1e293b";
                    this.ctx.lineWidth = cfg.mouthLineThickness || 1.5;
                    this.ctx.stroke();

                    this.ctx.save();
                    this.ctx.beginPath();
                    if (cfg.mouthOpenStyle === 'smiling') {
                        this.ctx.moveTo(-mouthW, -mouthH * 0.15);
                        this.ctx.quadraticCurveTo(0, -mouthH * 0.55, mouthW, -mouthH * 0.15);
                        this.ctx.quadraticCurveTo(0, mouthH * 1.55, -mouthW, -mouthH * 0.15);
                        this.ctx.closePath();
                    } else {
                        this.ctx.ellipse(0, 0, mouthW, mouthH, 0, 0, Math.PI * 2);
                    }
                    this.ctx.clip();

                    this.ctx.beginPath();
                    let tongueY, tongueW, tongueH;
                    if (cfg.mouthOpenStyle === 'smiling') {
                        tongueY = mouthH * 0.85;      
                        tongueW = mouthW * 0.55;      
                        tongueH = mouthH * 0.45;      
                    } else {
                        tongueY = mouthH * 0.65;      
                        tongueW = mouthW * 0.55;
                        tongueH = mouthH * 0.35;
                    }
                    this.ctx.ellipse(0, tongueY, tongueW, tongueH, 0, 0, Math.PI * 2);

                    const tongueGrad = this.ctx.createLinearGradient(0, tongueY - tongueH, 0, tongueY + tongueH);
                    tongueGrad.addColorStop(0, "#fda4af"); 
                    tongueGrad.addColorStop(1, "#f43f5e"); 
                    this.ctx.fillStyle = tongueGrad;
                    this.ctx.fill();

                    this.ctx.strokeStyle = "#be123c";
                    this.ctx.lineWidth = 1.5;
                    this.ctx.stroke();

                    this.ctx.beginPath();
                    this.ctx.moveTo(0, tongueY - tongueH * 0.4);
                    this.ctx.lineTo(0, tongueY + tongueH * 0.6);
                    this.ctx.strokeStyle = "#9f1239";
                    this.ctx.lineWidth = 1.5;
                    this.ctx.stroke();

                    this.ctx.restore();
                } else {
                    if (cfg.verticalLineLength > 0) {
                        this.ctx.beginPath();
                        this.ctx.moveTo(0, -cfg.verticalLineLength);
                        this.ctx.lineTo(0, 0);
                        this.ctx.strokeStyle = "#1e293b";
                        this.ctx.lineWidth = cfg.mouthLineThickness || 1.5;
                        this.ctx.lineCap = "round";
                        this.ctx.stroke();
                    }

                    this.ctx.beginPath();
                    this.ctx.moveTo(-cfg.mouthWidth, -2);
                    this.ctx.quadraticCurveTo(0, cfg.mouthCurve, cfg.mouthWidth, -2);
                    this.ctx.strokeStyle = "#1e293b";
                    this.ctx.lineWidth = (cfg.mouthLineThickness * 1.25) || 2.0;
                    this.ctx.lineCap = "round";
                    this.ctx.stroke();
                }
                this.ctx.restore();
            }
        };

        let voices = [];
        speechSynthesis.onvoiceschanged = () => { voices = speechSynthesis.getVoices(); };

        function speakText(text) {
            if (window.activeUtterance) {
                window.activeUtterance.onstart = null;
                window.activeUtterance.onend = null;
                window.activeUtterance.onerror = null;
            }
            clearTimeout(window.ttsFallbackTimeout);
            speechSynthesis.cancel();
            
            if (masterVolume === 0) {
                stopSpeaking();
                tutorBubble.innerHTML = text;
                return;
            }
            
            isTutorSpeaking = true;
            volSlider.disabled = true;
            tutorBubble.innerHTML = text;

            renderer.startSpeakingAnim('tts');

            const utterance = new SpeechSynthesisUtterance(text);
            window.activeUtterance = utterance;
            utterance.volume = masterVolume;

            const hasKoreanChars = /[ㄱ-ㅎ|ㅏ-ㅣ|가-힣]/.test(text);
            const targetLang = hasKoreanChars ? 'ko-KR' : 'en-US';
            utterance.lang = targetLang;

            if (voices.length === 0) voices = speechSynthesis.getVoices();
            let bestVoice = voices.find(v => v.lang.includes(targetLang) && (v.name.includes('Google') || v.name.includes('Natural')));
            if (!bestVoice) bestVoice = voices.find(v => v.lang.includes(targetLang));
            if (bestVoice) utterance.voice = bestVoice;

            const safePitch = parseFloat(mimicPitchValue) || 1.3;
            const basePitch = currentChar === 'xeno' ? 1.3 : 1.7;
            utterance.pitch = safePitch;
            utterance.rate = Math.min(1.4, Math.max(0.7, 0.95 * (safePitch / basePitch)));

            utterance.onstart = () => {
                renderer.startSpeakingAnim('tts');
            };
            utterance.onend = () => {
                stopSpeaking();
            };
            utterance.onerror = () => {
                stopSpeaking();
            };

            const duration = (text.length * 110) + 1500;
            window.ttsFallbackTimeout = setTimeout(() => {
                if (isTutorSpeaking) {
                    stopSpeaking();
                }
            }, duration);

            window.lastSpeakStartTime = Date.now();
            speechSynthesis.speak(utterance);
        }

        function stopSpeaking() {
            clearTimeout(window.ttsFallbackTimeout);
            if (window.activeUtterance) {
                window.activeUtterance.onstart = null;
                window.activeUtterance.onend = null;
                window.activeUtterance.onerror = null;
            }
            speechSynthesis.cancel(); 
            isTutorSpeaking = false;
            renderer.stopSpeakingAnim();
            volSlider.disabled = false;
            window.activeUtterance = null;
        }

        function setCharacter(char) {
            currentChar = char;

            stopSpeaking();
            stopMimicPlayMode(); 

            document.getElementById('char-xeno').className = "px-4 py-2 text-xs font-bold text-slate-500 rounded-lg transition-all";
            document.getElementById('char-xena').className = "px-4 py-2 text-xs font-bold text-slate-500 rounded-lg transition-all";

            if (char === 'xeno') {
                document.getElementById('char-xeno').className = "px-4 py-2 text-xs font-black bg-orange-500 text-white rounded-lg shadow-sm transition-all";
                tutorLabel.innerText = "XENO";
                bubbleContainer.className = "p-10 md:p-12 rounded-[2.5rem] bg-[#fffcf5] border-0 flex flex-col justify-center min-h-[220px] transition-all duration-500 shadow-sm relative";
                
                updatePitchModifier(1.3);
                if (hasInitialized) speakText("Hello, I'm Xeno. Press the START button!");
            } else {
                document.getElementById('char-xena').className = "px-4 py-2 text-xs font-black bg-blue-500 text-white rounded-lg shadow-sm transition-all";
                tutorLabel.innerText = "XENA";
                bubbleContainer.className = "p-10 md:p-12 rounded-[2.5rem] bg-[#f4faff] border-0 flex flex-col justify-center min-h-[220px] transition-all duration-500 shadow-sm relative";
                
                updatePitchModifier(1.7);
                if (hasInitialized) speakText("Hello, I'm Xena. Press the START button!");
            }
        }

        function updateVolume(val) {
            masterVolume = parseFloat(val);
            document.getElementById('volume-text').innerText = Math.round(masterVolume * 100) + '%';
        }

        function updatePitchModifier(val) {
            mimicPitchValue = parseFloat(val);
            document.getElementById('mimic-pitch-slider').value = val;
            document.getElementById('mimic-pitch-text').innerText = val + 'x';
        }

        function toggleMimicMode() {
            if (!hasInitialized) return;
            if (isMimicActive) stopMimicPlayMode();
            else startMimicPlayMode();
        }

        async function startMimicPlayMode() {
            if (isTutorSpeaking) stopSpeaking();

            isMimicActive = true;
            updatePitchModifier(1.5); 
            
            mainBtn.className = "px-12 py-5 bg-rose-600 hover:bg-rose-700 active:scale-95 text-white text-xl font-black rounded-2xl shadow-md transition-all flex items-center justify-center gap-3";
            btnIcon.innerText = "■";
            btnText.innerText = "STOP";

            userText.innerText = "Listening... Speak now! 🎙️";
            userText.className = "text-slate-800 font-extrabold text-2xl md:text-3xl leading-relaxed transition-all duration-300";
            
            micIndicator.classList.remove('hidden');
            micGaugeContainer.classList.remove('hidden');

            audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') await audioCtx.resume();

            if (!micStream) {
                try {
                    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                } catch (e) {
                    alert("Microphone permission is required for Mimic you play!");
                    stopMimicPlayMode();
                    return;
                }
            }

            setupAudioAnalyzerNodes();
            startVADMonitoring();
        }

        function stopMimicPlayMode() {
            isMimicActive = false;
            
            mainBtn.className = "px-12 py-5 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white text-xl font-black rounded-2xl shadow-md shadow-indigo-100 transition-all flex items-center justify-center gap-3";
            btnIcon.innerText = "▶";
            btnText.innerText = "START";

            userText.innerText = "Tutor is ready. Press START and say something!";
            userText.className = "text-slate-400 font-bold text-lg md:text-xl italic transition-all duration-300 leading-relaxed";

            micIndicator.classList.add('hidden');
            micGaugeContainer.classList.add('hidden');
            if (micGaugeFill) micGaugeFill.style.width = '0%';

            resetMimicLoop();

            // [메모리/배터리 누수 방지 1] 마이크 하드웨어 전원 완전 차단 (상단 빨간 점 제거)
            if (micStream) {
                micStream.getTracks().forEach(track => track.stop());
                micStream = null;
            }
            if (micSourceNode) {
                try { micSourceNode.disconnect(); } catch(e){}
                micSourceNode = null;
            }
        }

        function setupAudioAnalyzerNodes() {
            if (!micSourceNode && micStream) {
                micSourceNode = audioCtx.createMediaStreamSource(micStream);
                analyserNode = audioCtx.createAnalyser();
                analyserNode.fftSize = 256;
                micSourceNode.connect(analyserNode);
            }
        }

        function startVADMonitoring() {
            if (vadAnimationId) cancelAnimationFrame(vadAnimationId);

            const bufferLength = analyserNode.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            const checkVADLevel = () => {
                if (!isMimicActive) return;

                if (isPlaybackActive) {
                    vadAnimationId = requestAnimationFrame(checkVADLevel);
                    return;
                }

                analyserNode.getByteFrequencyData(dataArray);
                let sum = 0;
                for (let i = 0; i < bufferLength; i++) sum += dataArray[i];
                const average = sum / bufferLength;

                const percentage = Math.min(100, Math.round((average / 60) * 100));
                if (micGaugeFill) micGaugeFill.style.width = percentage + '%';

                if (average > VOICE_THRESHOLD) {
                    if (!isRecording) {
                        isRecording = true;
                        audioChunks = [];
                        recordStartTime = Date.now();
                        
                        userText.innerText = "Speak now! I'm listening... 🎙️";
                        
                        let recorderOptions = {};
                        if (typeof MediaRecorder !== 'undefined' && typeof MediaRecorder.isTypeSupported === 'function') {
                            if (MediaRecorder.isTypeSupported('audio/webm')) recorderOptions = { mimeType: 'audio/webm' };
                            else if (MediaRecorder.isTypeSupported('audio/mp4')) recorderOptions = { mimeType: 'audio/mp4' };
                            else if (MediaRecorder.isTypeSupported('audio/aac')) recorderOptions = { mimeType: 'audio/aac' };
                        }
                        mediaRecorder = new MediaRecorder(micStream, recorderOptions);
                        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
                        mediaRecorder.start();
                    }
                    silenceStartTime = null;
                } else {
                    if (isRecording) {
                        if (silenceStartTime === null) {
                            silenceStartTime = Date.now();
                        } else if (Date.now() - silenceStartTime > SILENCE_DURATION || Date.now() - recordStartTime > MAX_RECORD_TIME) {
                            isRecording = false;
                            silenceStartTime = null;
                            userText.innerText = "Processing voice... ⏳";
                            mediaRecorder.onstop = () => { playChipmunkModulatedVoice(); };
                            mediaRecorder.stop();
                        }
                    }
                }

                vadAnimationId = requestAnimationFrame(checkVADLevel);
            };

            checkVADLevel();
        }

        async function playChipmunkModulatedVoice() {
            if (audioChunks.length === 0) {
                isPlaybackActive = false;
                userText.innerText = "Listening... Speak now! 🎙️";
                return;
            }

            isPlaybackActive = true;
            userText.innerText = "Mimicking! 🔊";
            renderer.startSpeakingAnim('mimic');

            const mimeType = (mediaRecorder && mediaRecorder.mimeType) ? mediaRecorder.mimeType : 'audio/webm';
            const blob = new Blob(audioChunks, { type: mimeType });
            
            try {
                const arrayBuffer = await blob.arrayBuffer();
                const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

                const source = audioCtx.createBufferSource();
                source.buffer = audioBuffer;
                source.playbackRate.value = mimicPitchValue;

                playbackAnalyser = audioCtx.createAnalyser();
                playbackAnalyser.fftSize = 128;

                source.connect(playbackAnalyser);
                playbackAnalyser.connect(audioCtx.destination);

                source.start(0);

                source.onended = () => {
                    isPlaybackActive = false;
                    renderer.stopSpeakingAnim();
                    if (isMimicActive) userText.innerText = "Listening... Speak now! 🎙️";

                    // [메모리/배터리 누수 방지 2] 사용이 끝난 오디오 노드 명시적 연결 해제 (장시간 사용 시 튕김 방지)
                    try {
                        source.disconnect();
                        playbackAnalyser.disconnect();
                    } catch(e) {}
                };

            } catch (e) {
                console.error("Modulation Decoding failed:", e);
                isPlaybackActive = false;
                renderer.stopSpeakingAnim();
            }
        }

        function resetMimicLoop() {
            if (vadAnimationId) {
                cancelAnimationFrame(vadAnimationId);
                vadAnimationId = null;
            }
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                try { mediaRecorder.stop(); } catch(e){}
            }
            isRecording = false;
            isPlaybackActive = false;
            silenceStartTime = null;
            audioChunks = [];
            renderer.stopSpeakingAnim();
        }

        window.addEventListener('keydown', function(e) {
            if (e.code === 'Space') {
                e.preventDefault(); 
                if (hasInitialized) toggleMimicMode();
            }
        });

        function playWelcomeSpeech() {
            if (currentChar === 'xeno') {
                speakText("Hello, I'm Xeno. Press the START button!");
            } else {
                speakText("Hello, I'm Xena. Press the START button!");
            }
        }

        function initAppOnInteraction() {
            if (hasInitialized) return;
            hasInitialized = true;
            
            const overlay = document.getElementById('start-overlay');
            if (overlay) {
                overlay.style.display = 'none';
            }

            try {
                const unlockUtterance = new SpeechSynthesisUtterance('');
                unlockUtterance.volume = 0;
                window.speechSynthesis.speak(unlockUtterance);
                
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch (e) {
                console.warn("Audio unlock failed:", e);
            }

            playWelcomeSpeech();
        }

        window.onload = () => {
            renderer.init();
            setCharacter('xeno'); 
        };
    </script>
</body>
</html>
